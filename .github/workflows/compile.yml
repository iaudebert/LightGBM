name: Build LightGBM portable Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Recuperer le depot officiel LightGBM
        uses: actions/checkout@v5
        with:
          repository: lightgbm-org/LightGBM
          ref: v4.7.0
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Configurer la compilation
        shell: cmd
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_CLI=ON
          -DBUILD_STATIC_LIB=ON
          -DUSE_GPU=OFF
          -DUSE_CUDA=OFF
          -DUSE_MPI=OFF
          -DUSE_OPENMP=OFF

      - name: Compiler LightGBM
        shell: cmd
        run: cmake --build build --config Release --target lightgbm

      - name: Creer le dossier portable
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path build -Filter lightgbm.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "lightgbm.exe est introuvable"
          }

          New-Item -ItemType Directory -Path portable -Force
          Copy-Item $exe.FullName portable\lightgbm.exe

          @"
          task=train
          objective=poisson
          metric=poisson
          data=train.csv
          header=true
          label=Assistances
          output_model=model.txt
          learning_rate=0.03
          num_leaves=31
          max_depth=8
          min_data_in_leaf=30
          num_iterations=1000
          verbosity=1
          "@ | Set-Content portable\train.conf -Encoding ASCII

          @"
          task=predict
          data=predict.csv
          header=true
          input_model=model.txt
          output_result=predictions.txt
          verbosity=1
          "@ | Set-Content portable\predict.conf -Encoding ASCII

          @"
          @echo off
          cd /d "%~dp0"
          lightgbm.exe config=train.conf
          pause
          "@ | Set-Content portable\entrainer.bat -Encoding ASCII

          @"
          @echo off
          cd /d "%~dp0"
          lightgbm.exe config=predict.conf
          pause
          "@ | Set-Content portable\predire.bat -Encoding ASCII

          & portable\lightgbm.exe

          if ($LASTEXITCODE -ne 0) {
            throw "Le test de lightgbm.exe a echoue avec le code $LASTEXITCODE"
          }

      - name: Publier le dossier portable
        uses: actions/upload-artifact@v5
        with:
          name: LightGBM-Windows-portable
          path: portable
          if-no-files-found: error
          retention-days: 30
